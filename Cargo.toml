[package]
name = "yougile-to-gh"
version = "0.19.0"
edition = "2021"
description = "Convert YouGile task trees into GitHub issues"
readme = "README.md"
license = "Unlicense"
keywords = ["yougile", "github", "issues", "migration"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/konard/yougile-to-gh"
documentation = "https://github.com/konard/yougile-to-gh"
rust-version = "1.70"

# Narrow allowlist of files shipped in the published `.crate` archive.
# Keeping this list tight prevents docs, case studies, generated CI artifacts,
# changelog fragments, and experiments from silently inflating the release
# archive past the crates.io 10 MiB upload limit. See issue #58.
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[lib]
name = "yougile_to_gh"
path = "src/lib.rs"

[[bin]]
name = "yougile-to-gh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
regex = "1"
walkdir = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
